project:
  name: ndd-literature-corpus
  tool_name: ndd-literature-corpus

disease_scope:
  mondo_root: "MONDO:0700092"
  include_descendants: true
  rare_only: true
  use_orphanet: true

reference:
  mondo_url: "https://purl.obolibrary.org/obo/mondo.json"
  mondo_rare_url: "https://purl.obolibrary.org/obo/mondo/subsets/mondo-rare.json"
  orphanet_url: "https://www.orphadata.com/data/json/en_product1.json.tar.gz"

pubmed:
  start_year: 2010
  end_year: 2020
  batch_size: 500
  generic_ndd_query: true
  disease_name_queries: true
  gene_queries: false
  partition_limit: 9999

pmc:
  download_xml: true
  download_txt: false
  download_pdf: false
  download_json_metadata: true
  id_converter_batch_size: 200
  inventory_bucket_url: "https://pmc-oa-opendata.s3.amazonaws.com"

network:
  max_retries: 8
  timeout_seconds: 60
  requests_per_second_without_key: 2.5
  requests_per_second_with_key: 8.0

relevance:
  enabled: true
  backend: ollama
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen3:14b"
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 2
  prompt_version: "1"
  keep_labels:
    - HIGH
    - POSSIBLE

paths:
  data: data
  raw: data/raw
  interim: data/interim
  processed: data/processed
  logs: data/logs

debug:
  enabled: true
  disease_limit: 10
  pubmed_limit: 100
  pmc_limit: 20
