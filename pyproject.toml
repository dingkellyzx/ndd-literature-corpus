[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ndd-literature-corpus"
version = "0.1.0"
description = "Resumable neurodevelopmental disease literature acquisition pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "NDD Literature Corpus contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5.3,<7",
  "pyarrow>=17,<23",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/auto-tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ndd_corpus"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
